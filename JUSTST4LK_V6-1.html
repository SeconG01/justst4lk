<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUST STALK</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap">
<style>
:root {
  --bg:#080808; --s1:#111113; --s2:#1a1a1e; --s3:#252529; --s4:#3a3a42;
  --silver:#a8aac0; --chrome:#d0d2e0; --bright:#e8e8f5;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: 'Rajdhani', sans-serif;
  background: var(--bg); color: var(--bright);
  min-height: 100vh; display: flex;
  justify-content: center; align-items: center;
  padding: 24px 0;
}
.card {
  background: linear-gradient(135deg, rgba(20,20,26,.98), rgba(11,11,16,.99));
  border: 1px solid var(--s3); border-radius: 22px;
  padding: 40px 42px 36px; max-width: 556px; width: 93%;
  box-shadow: 0 28px 70px rgba(0,0,0,.85), inset 0 1px 0 rgba(200,200,235,.06);
}
.topline {
  height:1px;
  background: linear-gradient(90deg, transparent, rgba(168,170,192,.25), transparent);
  margin-bottom: 30px;
}
.hdr { text-align:center; margin-bottom:26px; }
.hdr h1 {
  font-weight:700; font-size:1.95em; letter-spacing:.22em;
  text-transform:uppercase; color:var(--chrome);
  text-shadow: 0 0 22px rgba(180,180,220,.28);
}
.hdr p {
  font-family:'Share Tech Mono',monospace; font-size:10px;
  letter-spacing:.32em; color:var(--s4); margin-top:4px; text-transform:uppercase;
}
.divl {
  height:1px;
  background: linear-gradient(90deg, transparent, var(--s3), transparent);
  margin-bottom:16px;
}
.gtabs { display:flex; gap:7px; margin-bottom:14px; }
.gtab {
  flex:1; padding:9px 3px 7px; background:var(--s2);
  border:1px solid var(--s3); border-radius:9px;
  cursor:pointer; text-align:center;
  transition:background .18s, border-color .18s, box-shadow .18s;
}
.gtab .gl {
  display:block; font-family:'Rajdhani',sans-serif;
  font-weight:700; font-size:.92em; letter-spacing:.1em; color:var(--silver);
}
.gtab:hover .gl { color:var(--bright); }
.gtab.gm.on  { background:rgba(55,85,175,.2); border-color:#607ac8; box-shadow:0 0 12px rgba(80,110,200,.18); }
.gtab.gm.on .gl  { color:#a0b8f0; }
.gtab.gf.on  { background:rgba(170,55,115,.2); border-color:#b86090; box-shadow:0 0 12px rgba(200,80,140,.18); }
.gtab.gf.on .gl  { color:#f0a0cc; }
.gtab.gfn.on { background:rgba(35,145,95,.2);  border-color:#48a872; box-shadow:0 0 12px rgba(55,175,115,.18); }
.gtab.gfn.on .gl { color:#78d4a4; }
.gtab.gall.on{ background:rgba(125,125,175,.14); border-color:var(--silver); }
.gtab.gall.on .gl{ color:var(--chrome); }
.swrap { position:relative; margin-bottom:14px; }
.sinp {
  width:100%; padding:11px 34px 11px 37px;
  background:var(--s1); border:1px solid var(--s3); border-radius:9px;
  color:var(--chrome); font-family:'Share Tech Mono',monospace;
  font-size:.87em; letter-spacing:.06em; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.sinp::placeholder { color:var(--s4); }
.sinp:focus { border-color:var(--silver); box-shadow:0 0 0 1px rgba(168,170,192,.14); }
.sico {
  position:absolute; left:11px; top:50%; transform:translateY(-50%);
  color:var(--s4); font-size:15px; pointer-events:none;
}
.sclr {
  position:absolute; right:9px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--s4); font-size:13px;
  cursor:pointer; padding:4px; display:none;
}
.sclr:hover { color:var(--silver); }
.ac {
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0;
  background:var(--s2); border:1px solid var(--s3); border-radius:9px;
  z-index:50; max-height:200px; overflow-y:auto;
  box-shadow:0 14px 38px rgba(0,0,0,.72);
  scrollbar-width:thin; scrollbar-color:var(--s4) transparent;
}
.ac.open { display:block; }
.acr {
  display:flex; align-items:center; justify-content:space-between;
  padding:9px 12px; border-bottom:1px solid rgba(255,255,255,.03);
  cursor:pointer; transition:background .1s;
}
.acr:last-child { border-bottom:none; }
.acr:hover, .acr.hi { background:var(--s3); }
.acn { font-family:'Share Tech Mono',monospace; font-size:.79em; color:var(--silver); }
.acn b { color:var(--chrome); }
.acm { display:flex; align-items:center; gap:5px; font-family:'Share Tech Mono',monospace; font-size:.71em; color:var(--s4); }
.tf  { padding:1px 5px; border-radius:3px; background:rgba(170,55,115,.25); color:#f0a0cc; font-size:.84em; }
.tfn { padding:1px 5px; border-radius:3px; background:rgba(35,145,95,.25); color:#78d4a4; font-size:.84em; }
/* Section badge */
.sec-badge {
  display:inline-flex; align-items:center; justify-content:center;
  padding:1px 6px; border-radius:3px; font-size:.84em; font-weight:700;
  background:rgba(255,180,0,.18); color:#ffd060;
  font-family:'Share Tech Mono',monospace;
}
/* Section tag in autocomplete */
.tsec {
  padding:1px 5px; border-radius:3px;
  background:rgba(255,180,0,.18); color:#ffd060;
  font-size:.84em; margin-right:2px;
}
/* Info line under roll */
.pinfo { font-family:'Share Tech Mono',monospace; font-size:.68em; letter-spacing:.18em; color:var(--s4); margin-top:3px; min-height:1em; }

.igrid { display:grid; grid-template-columns:1fr 1.2fr 1fr; gap:12px; margin-bottom:8px; }
.field { display:flex; flex-direction:column; align-items:center; gap:7px; }
.flbl {
  font-family:'Share Tech Mono',monospace; font-size:9px;
  letter-spacing:.3em; color:var(--s4); text-transform:uppercase;
}
.field:focus-within .flbl { color:var(--silver); }
.sbtn {
  width:34px; height:34px; background:var(--s2); border:1px solid var(--s3);
  border-radius:9px; color:var(--silver); font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .14s, border-color .14s, color .14s, transform .1s;
}
.sbtn:hover { background:var(--s3); border-color:var(--silver); color:var(--bright); }
.sbtn:active { transform:scale(.93); }
.finp {
  width:100%; background:var(--s1); border:1px solid var(--s3); border-radius:9px;
  color:var(--chrome); font-family:'Share Tech Mono',monospace;
  font-size:1.22em; text-align:center; padding:9px 5px; outline:none;
  transition:border-color .2s, box-shadow .2s, background .2s;
  -moz-appearance:textfield;
}
.finp::-webkit-outer-spin-button,
.finp::-webkit-inner-spin-button { -webkit-appearance:none; }
.finp:focus { border-color:var(--silver); background:var(--s2); box-shadow:0 0 0 1px rgba(168,170,192,.12); }
.prev { text-align:center; margin:13px 0 11px; }
.plbl { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:.3em; color:var(--s4); display:block; margin-bottom:5px; }
.pval { font-family:'Share Tech Mono',monospace; font-size:1.42em; letter-spacing:.2em; color:var(--chrome); text-shadow:0 0 16px rgba(200,200,232,.22); }
.pname { font-family:'Share Tech Mono',monospace; font-size:.75em; letter-spacing:.12em; color:var(--silver); margin-top:4px; min-height:1.1em; }
.arow { display:flex; align-items:center; justify-content:center; gap:11px; margin:10px 0; }
.tgl {
  width:42px; height:22px; background:var(--s2); border:1px solid var(--s3);
  border-radius:11px; position:relative; cursor:pointer;
  transition:background .24s, border-color .24s; flex-shrink:0;
}
.tgl::after {
  content:''; position:absolute; width:16px; height:16px;
  background:var(--s4); border-radius:50%; top:2px; left:2px;
  transition:left .24s, background .24s;
}
.tgl.on { background:rgba(140,140,200,.18); border-color:var(--silver); }
.tgl.on::after { background:var(--chrome); left:22px; }
.albl { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:.18em; color:var(--s4); cursor:pointer; }
.albl:hover { color:var(--silver); }
.ctr { font-family:'Share Tech Mono',monospace; font-size:9px; color:var(--s4); letter-spacing:.05em; }
.acts { display:flex; gap:10px; margin-top:15px; }
.btnp {
  flex:1; padding:14px; border-radius:12px; cursor:pointer;
  font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1em;
  letter-spacing:.15em; text-transform:uppercase;
  background:linear-gradient(135deg, rgba(95,95,175,.26), rgba(65,65,135,.2));
  border:1px solid rgba(168,170,192,.3); color:var(--chrome);
  transition:background .2s, border-color .2s, transform .14s, box-shadow .2s;
}
.btnp:hover {
  background:linear-gradient(135deg, rgba(120,120,200,.36), rgba(88,88,155,.28));
  border-color:var(--silver); color:var(--bright);
  transform:translateY(-2px); box-shadow:0 11px 28px rgba(0,0,0,.34);
}
.btnp:active { transform:translateY(0); }
.btns {
  flex:1; padding:14px; border-radius:12px; cursor:pointer;
  font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1em;
  letter-spacing:.15em; text-transform:uppercase;
  background:var(--s2); border:1px solid var(--s3); color:var(--s4);
  transition:background .2s, border-color .2s, color .2s, transform .14s;
}
.btns:hover { background:var(--s3); border-color:var(--s4); color:var(--silver); transform:translateY(-2px); }
.btns:active { transform:translateY(0); }
.toast {
  position:fixed; bottom:34px; left:50%;
  transform:translateX(-50%) translateY(65px);
  background:var(--s2); border:1px solid var(--s3); border-radius:10px;
  padding:11px 20px; font-family:'Share Tech Mono',monospace;
  font-size:11px; letter-spacing:.17em; color:var(--silver);
  z-index:100; opacity:0; pointer-events:none;
  transition:transform .32s cubic-bezier(.175,.885,.32,1.275), opacity .32s;
  box-shadow:0 14px 36px rgba(0,0,0,.62);
}
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
@media (max-width:480px) {
  .card { padding:28px 20px 24px; }
  .hdr h1 { font-size:1.55em; }
  .igrid { gap:8px; }
  .finp { font-size:1.08em; }
  .acts { flex-direction:column; }
}
@media (max-height:700px) { body { align-items:flex-start; padding:20px 0; } }
</style>
</head>

<div class="toast" id="toast"></div>

<div class="card">
  <div class="topline"></div>
  <div class="hdr">
    <h1>JUST STALK</h1>
    <p>GIETU Student Photo Lookup</p>
  </div>

  <div class="divl"></div>

  <div class="gtabs">
    <button class="gtab gm on" id="gM"   onclick="setGender('M')">
      <span class="gl">&#9794; MALE</span>
    </button>
    <button class="gtab gf"    id="gF"   onclick="setGender('F')">
      <span class="gl">&#9792; FEMALE</span>
    </button>
    <button class="gtab gfn"   id="gFN"  onclick="setGender('FN')">
      <span class="gl">&#10022; FOREIGN</span>
    </button>
    <button class="gtab gall"  id="gALL" onclick="setGender('ALL')">
      <span class="gl">&#9672; ALL</span>
    </button>
  </div>

  <div class="swrap" id="swrap">
    <span class="sico">&#9075;</span>
    <input class="sinp" id="sinp" type="text"
           placeholder="Search by name..." autocomplete="off"
           oninput="onSrch()" onkeydown="onSrchKey(event)">
    <button class="sclr" id="sclr" onclick="clrSrch()">&#10005;</button>
    <div class="ac" id="ac"></div>
  </div>

  <div class="igrid">
    <div class="field">
      <span class="flbl">Year</span>
      <button class="sbtn" onclick="chgYear(1)"  tabindex="-1">&#9650;</button>
      <input class="finp" type="number" id="year" value="25" min="0" max="99" oninput="updPrev()">
      <button class="sbtn" onclick="chgYear(-1)" tabindex="-1">&#9660;</button>
    </div>
    <div class="field">
      <span class="flbl">Department</span>
      <div style="height:34px"></div>
      <input class="finp" type="text" id="dept" value="CSE" style="text-transform:uppercase" oninput="deptChanged()">
      <div style="height:34px"></div>
    </div>
    <div class="field">
      <span class="flbl">Number</span>
      <button class="sbtn" onclick="chgNum(1)"  tabindex="-1">&#9650;</button>
      <input class="finp" type="text" id="number" value="001" maxlength="3" oninput="updPrev()">
      <button class="sbtn" onclick="chgNum(-1)" tabindex="-1">&#9660;</button>
    </div>
  </div>

  <div class="prev">
    <span class="plbl">// ROLL NUMBER</span>
    <div class="pval" id="rollPrev">25CSE001</div>
    <div class="pname" id="rollName">&nbsp;</div>
    <div class="pinfo" id="rollInfo">&nbsp;</div>
  </div>

  <div class="arow">
    <div class="tgl" id="tglBtn" onclick="tglAuto()"></div>
    <span class="albl" onclick="tglAuto()">AUTO OPEN</span>
    <span class="ctr" id="ctrSpan"></span>
  </div>

  <div class="acts">
    <button class="btnp" onclick="openImg()">&#10227; LOOKUP IMAGE</button>
    <button class="btns" onclick="resetAll()">&#10005; RESET</button>
  </div>
</div>

// Build fast lookup map
var rollMap = {};
for (var i = 0; i < studentDB.length; i++) {
  rollMap[studentDB[i].roll] = studentDB[i];
}

// State
var mode     = 'pc';
var autoOpen = false;
var activeG  = 'M';
var acIdx    = -1;

// DOM refs - cached after DOMContentLoaded equivalent (script at bottom)
var elYear   = document.getElementById('year');
var elDept   = document.getElementById('dept');
var elNum    = document.getElementById('number');
var elPrev   = document.getElementById('rollPrev');
var elName   = document.getElementById('rollName');
var elTgl    = document.getElementById('tglBtn');
var elCtr    = document.getElementById('ctrSpan');
var elToast  = document.getElementById('toast');
var elSinp   = document.getElementById('sinp');
var elSclr   = document.getElementById('sclr');
var elAc     = document.getElementById('ac');

// ── Helpers ──────────────────────────────────────────────────────────

function fmtN(n) {
  n = parseInt(n) || 0;
  if (n < 0) n = 0;
  if (n > 999) n = 999;
  return ('000' + n).slice(-3);
}

function normYear(y) {
  y = (y || '').toString().trim();
  if (y.length > 2) y = y.slice(-2); // e.g. "2026" -> "26"
  return y;
}

function getRoll() {
  var y = normYear(elYear.value);
  var d = elDept.value.toUpperCase().trim();
  var n = fmtN(elNum.value);
  return (y + d + n).toUpperCase();
}

function updPrev() {
  var roll = getRoll();
  elPrev.textContent = roll;
  var entry = rollMap[roll];
  elName.textContent = entry ? entry.name : '';
}

function toast(msg) {
  elToast.textContent = msg;
  elToast.classList.add('show');
  clearTimeout(elToast._tid);
  elToast._tid = setTimeout(function() { elToast.classList.remove('show'); }, 2500);
}

// ── Mode (legacy stub — mode selector removed) ────────────────────────

function setMode(m) {
  mode = m;
}

// ── Gender ───────────────────────────────────────────────────────────

function setGender(g) {
  activeG = g;
  var tabs = ['M','F','FN','ALL'];
  for (var i = 0; i < tabs.length; i++) {
    var btn = document.getElementById('g' + tabs[i]);
    if (btn) btn.classList.toggle('on', tabs[i] === g);
  }
  clrSrch();
  snapToFirst();
  toast(g === 'M' ? 'MALE MODE' : g === 'F' ? 'FEMALE MODE' : g === 'FN' ? 'FOREIGN MODE' : 'ALL MODE');
}

function getPool() {
  if (activeG === 'ALL') return studentDB.slice();
  var out = [];
  for (var i = 0; i < studentDB.length; i++) {
    if (studentDB[i].gender === activeG) out.push(studentDB[i]);
  }
  return out;
}

// Get entries matching current year + dept + active gender, sorted by number
function getDeptPool() {
  var y   = normYear(elYear.value);
  var d   = elDept.value.toUpperCase().trim();
  var pfx = (y + d).toUpperCase();
  var base = getPool();
  var out  = [];
  for (var i = 0; i < base.length; i++) {
    var r = base[i].roll.toUpperCase();
    if (r.indexOf(pfx) === 0 && r.length === pfx.length + 3) {
      out.push(base[i]);
    }
  }
  out.sort(function(a, b) {
    return parseInt(a.roll.slice(-3)) - parseInt(b.roll.slice(-3));
  });
  return out;
}

// ── Spinners ─────────────────────────────────────────────────────────

function chgYear(s) {
  var v = parseInt(elYear.value || 0) + s;
  if (v < 0) v = 99;
  if (v > 99) v = 0;
  elYear.value = v;
  snapToFirst();
}

// Plain +1/-1 on the number field, wrapping 1-999. Used as a fallback
// when the current year/dept/section has no catalogued students, so the
// up/down arrows always do *something* instead of appearing dead.
function bumpNumPlain(s) {
  var cur = parseInt(fmtN(elNum.value));
  var next = cur + s;
  if (next < 1) next = 999;
  if (next > 999) next = 1;
  elNum.value = fmtN(next);
  updPrev();
  elCtr.textContent = '0/0';
  if (autoOpen) openImg();
}

// chgNum: jump to next/prev REAL entry in deptPool — skips gaps
// When a section is active: auto-advances dept when reaching boundary
function chgNum(s) {
  var dp = getDeptPool();

  // If section is active and autoOpen, work across the full section pool
  if (activeSec !== 'ALL' && autoOpen) {
    // Get ALL rolls in this section (across all depts) for current gender
    var secPool = [];
    var base = _origGetPool ? _origGetPool() : studentDB.slice();
    for (var i = 0; i < base.length; i++) {
      if (sectionMap[base[i].roll] === activeSec) secPool.push(base[i]);
    }
    if (!secPool.length) {
      // No catalogued students for this section — fall back to a plain
      // increment/decrement so the arrows still move through roll numbers.
      bumpNumPlain(s);
      return;
    }

    var roll = getRoll();
    var pos = -1;
    for (var i = 0; i < secPool.length; i++) {
      if (secPool[i].roll === roll) { pos = i; break; }
    }

    var next;
    if (pos === -1) {
      next = s > 0 ? 0 : secPool.length - 1;
    } else {
      next = (pos + s + secPool.length) % secPool.length;
    }

    var nextRoll = secPool[next].roll;
    var yr   = nextRoll.substring(0, 2);
    var dept = nextRoll.substring(2, nextRoll.length - 3);
    var num  = nextRoll.slice(-3);

    elYear.value = yr;
    elDept.value = dept;
    elNum.value  = num;
    updPrev();

    // Update counter relative to full section pool
    elCtr.textContent = (next + 1) + '/' + secPool.length;
    if (autoOpen) openImg();
    return;
  }

  // Normal mode (no section or no autoOpen)
  if (!dp.length) {
    // No catalogued students for this year/dept combo (e.g. a new batch
    // like 26 that hasn't been added to the local database yet) — fall
    // back to a plain increment/decrement so the arrows still work.
    bumpNumPlain(s);
    return;
  }
  var roll = getRoll();
  var pos  = -1;
  for (var i = 0; i < dp.length; i++) {
    if (dp[i].roll === roll) { pos = i; break; }
  }

  var next;
  if (pos === -1) {
    var cur = parseInt(fmtN(elNum.value));
    if (s > 0) {
      next = 0;
      for (var i = 0; i < dp.length; i++) {
        if (parseInt(dp[i].roll.slice(-3)) > cur) { next = i; break; }
      }
    } else {
      next = dp.length - 1;
      for (var i = dp.length - 1; i >= 0; i--) {
        if (parseInt(dp[i].roll.slice(-3)) < cur) { next = i; break; }
      }
    }
  } else {
    next = (pos + s + dp.length) % dp.length;
  }

  elNum.value = dp[next].roll.slice(-3);
  updPrev();
  elCtr.textContent = (next + 1) + '/' + dp.length;
  if (autoOpen) openImg();
}

// Snap number to first valid entry for current dept+gender+section
function snapToFirst() {
  // If section active, also align dept to first roll in that section
  if (activeSec !== 'ALL') {
    var base = _origGetPool ? _origGetPool() : studentDB.slice();
    var secRolls = [];
    for (var i = 0; i < base.length; i++) {
      if (sectionMap[base[i].roll] === activeSec) secRolls.push(base[i]);
    }
    if (secRolls.length) {
      var firstRoll = secRolls[0].roll;
      var yr   = firstRoll.substring(0, 2);
      var dept = firstRoll.substring(2, firstRoll.length - 3);
      elYear.value = yr;
      elDept.value = dept;
      elNum.value  = firstRoll.slice(-3);
      elCtr.textContent = '1/' + secRolls.length;
      updPrev();
      return;
    }
  }
  var dp = getDeptPool();
  if (dp.length) {
    elNum.value = dp[0].roll.slice(-3);
    elCtr.textContent = '1/' + dp.length;
  } else {
    elNum.value = '001';
    elCtr.textContent = '0/0';
  }
  updPrev();
}

function deptChanged() {
  var inp = elDept;
  var s = inp.selectionStart, e = inp.selectionEnd;
  inp.value = inp.value.toUpperCase();
  inp.setSelectionRange(s, e);
  snapToFirst();
}

// ── Auto open ────────────────────────────────────────────────────────

function tglAuto() {
  autoOpen = !autoOpen;
  elTgl.classList.toggle('on', autoOpen);
  toast(autoOpen ? 'AUTO OPEN: ON' : 'AUTO OPEN: OFF');
}

// ── Open image — gender enforced ─────────────────────────────────────

function openImg() {
  var roll = getRoll();
  var entry = rollMap[roll];
  // Only block on a gender mismatch when we actually know who this roll
  // belongs to. Unknown rolls (new/uncatalogued batches like 26) should
  // still be openable — the ERP is the source of truth, not our local db.
  if (activeG !== 'ALL' && entry && entry.gender !== activeG) {
    var sec = entry.gender === 'F' ? 'FEMALE' : entry.gender === 'FN' ? 'FOREIGN' : 'MALE';
    toast('WARNING: ' + entry.name + ' IS IN ' + sec);
    return;
  }
  var url = 'https://gietuerp.in/Student/GetStudentImage?rollno=' + roll;
  window.open(url, '_blank');
  toast(roll + (entry ? '  ' + entry.name : '  (not catalogued)'));
}

// ── Reset ────────────────────────────────────────────────────────────

function resetAll() {
  autoOpen = false;
  elTgl.classList.remove('on');
  elYear.value = '25';
  elDept.value = 'CSE';
  clrSrch();
  elCtr.textContent = '';
  snapToFirst();
  toast('RESET');
}

// ── Search / Autocomplete ────────────────────────────────────────────

function onSrch() {
  var q = elSinp.value.trim();
  elSclr.style.display = q ? 'block' : 'none';
  if (!q) { closeAc(); return; }
  var ql = q.toLowerCase();
  var pool = getPool();
  var hits = [];
  for (var i = 0; i < pool.length && hits.length < 40; i++) {
    if (pool[i].name.toLowerCase().indexOf(ql) !== -1) hits.push(pool[i]);
  }
  renderAc(hits, ql);
}

function renderAc(hits, ql) {
  if (!hits.length) { closeAc(); return; }
  acIdx = -1;
  // Escape ql for use in regex
  var esc = ql.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  var re  = new RegExp('(' + esc + ')', 'gi');
  var html = '';
  for (var i = 0; i < hits.length; i++) {
    var e   = hits[i];
    var hi  = e.name.replace(re, '<b>$1</b>');
    var tag = e.gender === 'F'  ? '<span class="tf">F</span>' :
              e.gender === 'FN' ? '<span class="tfn">FN</span>' : '';
    html += '<div class="acr" data-roll="' + e.roll + '" data-idx="' + i + '">' +
              '<span class="acn">' + hi + '</span>' +
              '<span class="acm">' + tag + '<span>' + e.roll + '</span></span>' +
            '</div>';
  }
  elAc.innerHTML = html;

  // Attach events after setting innerHTML
  var rows = elAc.querySelectorAll('.acr');
  for (var j = 0; j < rows.length; j++) {
    (function(row) {
      row.addEventListener('mousedown', function(ev) {
        ev.preventDefault();
        pickAc(row.dataset.roll);
      });
      row.addEventListener('mouseover', function() {
        var idx = parseInt(row.dataset.idx);
        acIdx = idx;
        for (var k = 0; k < rows.length; k++) rows[k].classList.toggle('hi', k === idx);
      });
    })(rows[j]);
  }

  elAc.classList.add('open');
}

function pickAc(roll) {
  var entry = rollMap[roll];
  elSinp.value = entry ? entry.name : roll;
  elSclr.style.display = 'block';
  closeAc();
  elYear.value  = roll.substring(0, 2);
  elDept.value  = roll.substring(2, roll.length - 3);
  elNum.value   = roll.slice(-3);
  var dp  = getDeptPool();
  var pos = -1;
  for (var i = 0; i < dp.length; i++) { if (dp[i].roll === roll) { pos = i; break; } }
  elCtr.textContent = pos >= 0 ? (pos + 1) + '/' + dp.length : '';
  updPrev();
  toast(roll + (entry ? '  ' + entry.name : ''));
  if (autoOpen) openImg();
}

function hvAc(idx) {
  acIdx = idx;
  var rows = elAc.querySelectorAll('.acr');
  for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('hi', i === idx);
}

function onSrchKey(ev) {
  var rows = elAc.querySelectorAll('.acr');
  if (ev.key === 'ArrowDown') {
    ev.preventDefault();
    acIdx = Math.min(acIdx + 1, rows.length - 1);
    for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('hi', i === acIdx);
    if (rows[acIdx]) rows[acIdx].scrollIntoView({block:'nearest'});
  } else if (ev.key === 'ArrowUp') {
    ev.preventDefault();
    acIdx = Math.max(acIdx - 1, 0);
    for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('hi', i === acIdx);
    if (rows[acIdx]) rows[acIdx].scrollIntoView({block:'nearest'});
  } else if (ev.key === 'Enter') {
    if (acIdx >= 0 && rows[acIdx]) {
      pickAc(rows[acIdx].dataset.roll);
    } else {
      var q = elSinp.value.trim().toLowerCase();
      var pool = getPool();
      for (var i = 0; i < pool.length; i++) {
        if (pool[i].name.toLowerCase().indexOf(q) !== -1) { pickAc(pool[i].roll); break; }
      }
    }
  } else if (ev.key === 'Escape') {
    closeAc();
  }
}

function closeAc() { elAc.classList.remove('open'); acIdx = -1; }

function clrSrch() {
  elSinp.value = '';
  elSclr.style.display = 'none';
  closeAc();

var activeSec = 'ALL';

// Override getPool to also filter by section
var _origGetPool = getPool;
getPool = function() {
  var base = _origGetPool();
  if (activeSec === 'ALL') return base;
  var out = [];
  for (var i = 0; i < base.length; i++) {
    if (sectionMap[base[i].roll] === activeSec) out.push(base[i]);
  }
  return out;
};

// Override updPrev to show section info
var _origUpdPrev = updPrev;
updPrev = function() {
  _origUpdPrev();
  var roll = getRoll();
  var entry = rollMap[roll];
  var infoEl = document.getElementById('rollInfo');
  if (!infoEl) return;
  if (entry) {
    var sec = sectionMap[roll];
    var gStr = entry.gender === 'F' ? 'FEMALE' : entry.gender === 'FN' ? 'FOREIGN' : 'MALE';
    infoEl.textContent = gStr + (sec ? '  ·  SEC ' + sec : '');
  } else {
    infoEl.textContent = '\u00a0';
  }
};

// Override renderAc to add section tag
var _origRenderAc = renderAc;
renderAc = function(hits, ql) {
  if (!hits.length) { closeAc(); return; }
  acIdx = -1;
  var esc = ql.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  var re  = new RegExp('(' + esc + ')', 'gi');
  var html2 = '';
  for (var i = 0; i < hits.length; i++) {
    var e   = hits[i];
    var hi  = e.name.replace(re, '<b>$1</b>');
    var tag = e.gender === 'F'  ? '<span class="tf">F</span>' :
              e.gender === 'FN' ? '<span class="tfn">FN</span>' : '';
    var sec = sectionMap[e.roll];
    var secTag = sec ? '<span class="tsec">' + sec + '</span>' : '';
    html2 += '<div class="acr" data-roll="' + e.roll + '" data-idx="' + i + '">' +
              '<span class="acn">' + hi + '</span>' +
              '<span class="acm">' + secTag + tag + '<span>' + e.roll + '</span></span>' +
            '</div>';
  }
  elAc.innerHTML = html2;
  var rows = elAc.querySelectorAll('.acr');
  for (var j = 0; j < rows.length; j++) {
    (function(row) {
      row.addEventListener('mousedown', function(ev) {
        ev.preventDefault();
        pickAc(row.dataset.roll);
      });
      row.addEventListener('mouseover', function() {
        var idx = parseInt(row.dataset.idx);
        acIdx = idx;
        for (var k = 0; k < rows.length; k++) rows[k].classList.toggle('hi', k === idx);
      });
    })(rows[j]);
  }
  elAc.classList.add('open');
};

snapToFirst();
updPrev();
